<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 651.616 303.6" width="651.616" height="303.6" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="User" data-to="Supervisor" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="345.44449999999995,76.9 345.44449999999995,124.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Supervisor" data-to="AgentA" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="345.44449999999995,161.8 345.44449999999995,179.8 132.48149999999998,179.8 132.48149999999998,197.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Supervisor" data-to="AgentB" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="345.44449999999995,161.8 345.44449999999995,179.8 345.44449999999995,179.8 345.44449999999995,197.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Supervisor" data-to="Output" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="345.44449999999995,161.8 345.44449999999995,179.8 538.771,179.8 538.771,197.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="User" data-label="用户需求：'我要去上海出差，帮我订机票和酒店'" data-shape="rectangle">
  <rect x="165.89549999999997" y="40" width="359.09799999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="345.44449999999995" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">用户需求：&#39;我要去上海出差，帮我订机票和酒店&#39;</text>
</g>
<g class="node" data-id="Supervisor" data-label="总调度协调器 (Supervisor)" data-shape="rectangle">
  <rect x="241.10699999999997" y="124.9" width="208.67499999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="345.44449999999995" y="143.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">总调度协调器 (Supervisor)</text>
</g>
<g class="node" data-id="AgentA" data-label="机票智能体 (携程专家)
专精查航班、订机票" data-shape="rectangle">
  <rect x="40" y="197.8" width="184.96299999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="132.48149999999998" y="224.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="132.48149999999998" dy="-3.9000000000000012">机票智能体 (携程专家)</tspan><tspan x="132.48149999999998" dy="16.900000000000002">专精查航班、订机票</tspan></text>
</g>
<g class="node" data-id="AgentB" data-label="酒店智能体 (美团专家)
专精查商圈、订客房" data-shape="rectangle">
  <rect x="252.96299999999997" y="197.8" width="184.96299999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="345.44449999999995" y="224.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="345.44449999999995" dy="-3.9000000000000012">酒店智能体 (美团专家)</tspan><tspan x="345.44449999999995" dy="16.900000000000002">专精查商圈、订客房</tspan></text>
</g>
<g class="node" data-id="Output" data-label="汇总综合行程单" data-shape="rectangle">
  <rect x="465.92599999999993" y="197.8" width="145.69" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="538.771" y="216.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">汇总综合行程单</text>
</g>
</svg>
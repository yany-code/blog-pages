<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 531.002 807.1099999999999" width="531.002" height="807.1099999999999" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="_Superstep___" data-label="一个 Superstep (超步 / 调度轮次)">
  <rect x="89.53" y="58" width="401.4719999999999" height="317.40000000000003" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="89.53" y="58" width="401.4719999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="101.53" y="72" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">一个 Superstep (超步 / 调度轮次)</text>
</g>
<polyline class="edge" data-from="NextStep" data-to="End" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="无" points="170.63299999999998,613.9100000000001 170.63299999999998,730.21" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="U" data-to="NextStep" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="290.26599999999996,359.40000000000003 290.26599999999996,417.40000000000003 201.38466666666665,417.40000000000003 201.38466666666665,460.1516666666667" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="NextStep" data-to="P" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="有" points="139.88133333333332,460.1516666666667 139.88133333333332,417.40000000000003 51,417.40000000000003 51,40 290.26599999999996,40 290.26599999999996,102" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="P" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="290.26599999999996,155.8 290.26599999999996,203.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E" data-to="U" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="290.26599999999996,257.6 290.26599999999996,305.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="NextStep" data-to="End" data-label="无">
  <rect x="155.63299999999998" y="656.9100000000001" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="170.39799999999997" y="672.0600000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">无</text>
</g>
<g class="edge-label" data-from="NextStep" data-to="P" data-label="有">
  <rect x="36" y="380.1" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="50.765" y="395.25" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">有</text>
</g>
<g class="node" data-id="NextStep" data-label="还有后续节点吗？" data-shape="diamond">
  <polygon points="170.63299999999998,429.4 262.888,521.655 170.63299999999998,613.91 78.37799999999999,521.655" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="170.63299999999998" y="521.655" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">还有后续节点吗？</text>
</g>
<g class="node" data-id="End" data-label="图执行完毕，返回最终 State" data-shape="rectangle">
  <rect x="59.62650000000001" y="730.21" width="222.01299999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="170.63299999999998" y="748.6600000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">图执行完毕，返回最终 State</text>
</g>
<g class="node" data-id="P" data-label="1. Plan (计划)
计算当前有哪些节点被激活准备执行" data-shape="rectangle">
  <rect x="150.731" y="102" width="279.06999999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="290.26599999999996" y="128.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="290.26599999999996" dy="-3.9000000000000012">1. Plan (计划)</tspan><tspan x="290.26599999999996" dy="16.900000000000002">计算当前有哪些节点被激活准备执行</tspan></text>
</g>
<g class="node" data-id="E" data-label="2. Execute (执行)
并行并发运行这些激活的节点 (Actors)" data-shape="rectangle">
  <rect x="148.1375" y="203.8" width="284.25699999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="290.26599999999996" y="230.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="290.26599999999996" dy="-3.9000000000000012">2. Execute (执行)</tspan><tspan x="290.26599999999996" dy="16.900000000000002">并行并发运行这些激活的节点 (Actors)</tspan></text>
</g>
<g class="node" data-id="U" data-label="3. Update (更新)
收集所有节点输出，按 Reducer 统一写入 State 通道" data-shape="rectangle">
  <rect x="105.53" y="305.6" width="369.4719999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="290.26599999999996" y="332.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="290.26599999999996" dy="-3.9000000000000012">3. Update (更新)</tspan><tspan x="290.26599999999996" dy="16.900000000000002">收集所有节点输出，按 Reducer 统一写入 State 通道</tspan></text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 618.9979999999999 249.4" width="618.9979999999999" height="249.4" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="164.201,75.35 212.201,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="391.977,75.35 439.977,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="Tool (工具)
螺丝刀 / 扳手
(具体能力)" data-shape="rectangle">
  <rect x="40.000000000000014" y="40" width="124.20099999999998" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="102.10050000000001" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="102.10050000000001" dy="-12.350000000000001">Tool (工具)</tspan><tspan x="102.10050000000001" dy="16.900000000000002">螺丝刀 / 扳手</tspan><tspan x="102.10050000000001" dy="16.900000000000002">(具体能力)</tspan></text>
</g>
<g class="node" data-id="B" data-label="Tool Calling (工具调用)
'我想用 10 号扳手'
(调用机制)" data-shape="rectangle">
  <rect x="212.201" y="40" width="179.77599999999998" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="302.089" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="302.089" dy="-12.350000000000001">Tool Calling (工具调用)</tspan><tspan x="302.089" dy="16.900000000000002">&#39;我想用 10 号扳手&#39;</tspan><tspan x="302.089" dy="16.900000000000002">(调用机制)</tspan></text>
</g>
<g class="node" data-id="C" data-label="Agent (智能体)
工匠 / 调度大脑
(自主规划循环)" data-shape="rectangle">
  <rect x="439.977" y="40" width="139.021" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="509.48749999999995" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="509.48749999999995" dy="-12.350000000000001">Agent (智能体)</tspan><tspan x="509.48749999999995" dy="16.900000000000002">工匠 / 调度大脑</tspan><tspan x="509.48749999999995" dy="16.900000000000002">(自主规划循环)</tspan></text>
</g>
<g class="node" data-id="D" data-label="MCP (上下文协议)
Type-C 通用插口
(跨进程/语言标准)" data-shape="rectangle">
  <rect x="40" y="138.7" width="156.805" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="118.4025" y="174.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="118.4025" dy="-12.350000000000001">MCP (上下文协议)</tspan><tspan x="118.4025" dy="16.900000000000002">Type-C 通用插口</tspan><tspan x="118.4025" dy="16.900000000000002">(跨进程/语言标准)</tspan></text>
</g>
</svg>
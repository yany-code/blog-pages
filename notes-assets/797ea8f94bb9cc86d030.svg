<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256.836 133.8" width="1256.836" height="133.8" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="215.32999999999998,66.9 263.33,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="463.8539999999999,66.9 511.8539999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="726.4569999999999,66.9 774.4569999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="963.1249999999999,66.9 1011.1249999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="1. 查询侧优化
(Query Rewrite / HyDE)" data-shape="rectangle">
  <rect x="40" y="40" width="175.32999999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="127.66499999999999" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="127.66499999999999" dy="-3.9000000000000012">1. 查询侧优化</tspan><tspan x="127.66499999999999" dy="16.900000000000002">(Query Rewrite / HyDE)</tspan></text>
</g>
<g class="node" data-id="B" data-label="2. 索引侧优化
(多级分块 / 增加Metadata)" data-shape="rectangle">
  <rect x="263.33" y="40" width="200.52399999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="363.592" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="363.592" dy="-3.9000000000000012">2. 索引侧优化</tspan><tspan x="363.592" dy="16.900000000000002">(多级分块 / 增加Metadata)</tspan></text>
</g>
<g class="node" data-id="C" data-label="3. 检索侧优化
(稠密向量 + BM25混合检索)" data-shape="rectangle">
  <rect x="511.8539999999999" y="40" width="214.60299999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="619.1555" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="619.1555" dy="-3.9000000000000012">3. 检索侧优化</tspan><tspan x="619.1555" dy="16.900000000000002">(稠密向量 + BM25混合检索)</tspan></text>
</g>
<g class="node" data-id="D" data-label="4. 排序侧优化
(Cross-Encoder Rerank)" data-shape="rectangle">
  <rect x="774.4569999999999" y="40" width="188.668" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="868.7909999999999" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="868.7909999999999" dy="-3.9000000000000012">4. 排序侧优化</tspan><tspan x="868.7909999999999" dy="16.900000000000002">(Cross-Encoder Rerank)</tspan></text>
</g>
<g class="node" data-id="E" data-label="5. 生成侧优化
(引用溯源 / 强防幻觉约束)" data-shape="rectangle">
  <rect x="1011.1249999999999" y="40" width="205.71099999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1113.9805" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1113.9805" dy="-3.9000000000000012">5. 生成侧优化</tspan><tspan x="1113.9805" dy="16.900000000000002">(引用溯源 / 强防幻觉约束)</tspan></text>
</g>
</svg>
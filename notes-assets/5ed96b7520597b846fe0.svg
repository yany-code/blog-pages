<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810.031 367.6" width="810.031" height="367.6" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="" data-label="工具箱层">
  <rect x="217.80275000000003" y="40" width="344.41499999999985" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="217.80275000000003" y="40" width="344.41499999999985" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="229.80275000000003" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">工具箱层</text>
</g>
<g class="subgraph" data-id="" data-label="工具箱层">
  <rect x="40" y="213.8" width="730.031" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="213.8" width="730.031" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="227.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">工具箱层</text>
</g>
<polyline class="edge" data-from="LC" data-to="LCEL" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="390.0102499999999,137.8 390.0102499999999,197.8 208.50249999999994,197.8 208.50249999999994,257.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="LC" data-to="LG" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="390.0102499999999,137.8 390.0102499999999,197.8 571.5179999999999,197.8 571.5179999999999,257.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="LC" data-label="LangChain
(组件库：提供 Model, Prompt, Tools, Loader)" data-shape="rectangle">
  <rect x="233.80275000000003" y="84" width="312.41499999999985" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="390.0102499999999" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="390.0102499999999" dy="-3.9000000000000012">LangChain</tspan><tspan x="390.0102499999999" dy="16.900000000000002">(组件库：提供 Model, Prompt, Tools, Loader)</tspan></text>
</g>
<g class="node" data-id="LCEL" data-label="LCEL 链式调用
(适合简单直线：Prompt -&gt; Model -&gt; Parser)" data-shape="rectangle">
  <rect x="56" y="257.8" width="305.0049999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="208.50249999999994" y="284.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="208.50249999999994" dy="-3.9000000000000012">LCEL 链式调用</tspan><tspan x="208.50249999999994" dy="16.900000000000002">(适合简单直线：Prompt -&gt; Model -&gt; Parser)</tspan></text>
</g>
<g class="node" data-id="LG" data-label="LangGraph 图编排
(适合复杂网络：分支、循环、多Agent、人工介入)" data-shape="rectangle">
  <rect x="389.0049999999999" y="257.8" width="365.026" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="571.5179999999999" y="284.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="571.5179999999999" dy="-3.9000000000000012">LangGraph 图编排</tspan><tspan x="571.5179999999999" dy="16.900000000000002">(适合复杂网络：分支、循环、多Agent、人工介入)</tspan></text>
</g>
</svg>
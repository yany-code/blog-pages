<g class="edge-label" data-from="Reducer" data-to="O" data-label="没写 Reducer">
  <rect x="107.395" y="369.90599999999995" width="84.77200000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="149.781" y="385.0559999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">没写 Reducer</text>

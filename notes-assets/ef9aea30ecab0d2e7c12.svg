  <text x="723.7339999999999" y="409.0559999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">operator.add</text>
</g>
<g class="edge-label" data-from="Reducer" data-to="C" data-label="自定义函数">
  <rect x="968.3789999999999" y="369.90599999999995" width="77.05000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1006.9039999999999" y="385.0559999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">自定义函数</text>
</g>

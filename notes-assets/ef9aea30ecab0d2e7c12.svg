  <text x="149.89499999999998" y="482.106" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="149.89499999999998" dy="-3.9000000000000012">1. 默认覆盖更新 (Overwrite)</tspan><tspan x="149.89499999999998" dy="16.900000000000002">旧值直接被抹掉，换成新值</tspan></text>
</g>
<g class="node" data-id="M" data-label="2. 消息追加 (add_messages)
新消息追加末尾；同ID消息原地修改" data-shape="rectangle">
  <rect x="287.78999999999996" y="455.206" width="276.10599999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="425.84299999999996" y="482.106" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="425.84299999999996" dy="-3.9000000000000012">2. 消息追加 (add_messages)</tspan><tspan x="425.84299999999996" dy="16.900000000000002">新消息追加末尾；同ID消息原地修改</tspan></text>
</g>
<g class="node" data-id="A" data-label="3. 累加/拼接 (operator.add)

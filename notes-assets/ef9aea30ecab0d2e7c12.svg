  <text x="468.4505" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">旧 State 中的字段值</text>
</g>
<g class="node" data-id="New" data-label="节点返回的局部更新字典" data-shape="rectangle">

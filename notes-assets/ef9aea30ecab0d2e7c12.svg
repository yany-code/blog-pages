<polyline class="edge" data-from="Reducer" data-to="A" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="operator.add" points="597.5326,328.30539999999996 597.5326,386.90599999999995 724.021,386.90599999999995 724.021,455.206" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1424.384 133.8" width="1424.384" height="133.8" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Caller" data-to="InFilter" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="仅传入 input_schema 允许的字段" points="156.05,66.9 425.644,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="InFilter" data-to="GraphWork" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="526.874,66.9 574.874,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="GraphWork" data-to="OutFilter" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="828.75,66.9 876.75,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="OutFilter" data-to="Result" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="仅返回 output_schema 允许的字段" points="977.98,66.9 1253.5140000000001,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Caller" data-to="InFilter" data-label="仅传入 input_schema 允许的字段">
  <rect x="200.05" y="50.90000000000001" width="181.59400000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="290.84700000000004" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">仅传入 input_schema 允许的字段</text>
</g>
<g class="edge-label" data-from="OutFilter" data-to="Result" data-label="仅返回 output_schema 允许的字段">
  <rect x="1021.98" y="50.90000000000001" width="187.53400000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1115.747" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">仅返回 output_schema 允许的字段</text>
</g>
<g class="node" data-id="Caller" data-label="外部调用方" data-shape="rectangle">
  <rect x="40" y="48.45" width="116.05" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="98.025" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">外部调用方</text>
</g>
<g class="node" data-id="InFilter" data-label="入参过滤" data-shape="rectangle">
  <rect x="425.644" y="48.45" width="101.22999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="476.259" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">入参过滤</text>
</g>
<g class="node" data-id="GraphWork" data-label="图内部节点流转
(运行在完整的 state_schema 之上)" data-shape="rectangle">
  <rect x="574.874" y="40" width="253.87599999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="701.812" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="701.812" dy="-3.9000000000000012">图内部节点流转</tspan><tspan x="701.812" dy="16.900000000000002">(运行在完整的 state_schema 之上)</tspan></text>
</g>
<g class="node" data-id="OutFilter" data-label="出参过滤" data-shape="rectangle">
  <rect x="876.75" y="48.45" width="101.22999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="927.365" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">出参过滤</text>
</g>
<g class="node" data-id="Result" data-label="最终干净响应" data-shape="rectangle">
  <rect x="1253.5140000000001" y="48.45" width="130.87" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1318.949" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">最终干净响应</text>
</g>
</svg>
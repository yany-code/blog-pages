<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 887.9599999999999 422.45" width="887.9599999999999" height="422.45" style="--bg:#FFFFFF;--fg:#3B3B3B;--line:#3B3B3B;--accent:#005FB8;--muted:#3B3B3BCC;--surface:#F8F8F8;--border:#3B3B3B;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="User" x1="70" y1="92.45" x2="70" y2="392.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="RWMH" x1="286.276" y1="70" x2="286.276" y2="392.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Storage" x1="585.49" y1="70" x2="585.49" y2="392.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Model" x1="803.194" y1="70" x2="803.194" y2="392.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="User" data-to="RWMH" data-label="发送新问题 (带 session_id)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="112.45" x2="286.276" y2="112.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="178.138" y="102.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">发送新问题 (带 session_id)</text>
</g>
<g class="message" data-from="RWMH" data-to="Storage" data-label="1. 读取该 session_id 的历史消息" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="286.276" y1="152.45" x2="585.49" y2="152.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="435.88300000000004" y="142.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">1. 读取该 session_id 的历史消息</text>
</g>
<g class="message" data-from="Storage" data-to="RWMH" data-label="返回 [HumanMessage, AIMessage...]" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="585.49" y1="192.45" x2="286.276" y2="192.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="435.88300000000004" y="182.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回 [HumanMessage, AIMessage...]</text>
</g>
<g class="message" data-from="RWMH" data-to="Model" data-label="2. 拼入 MessagesPlaceholder 并调用" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="286.276" y1="232.45" x2="803.194" y2="232.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="544.735" y="222.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">2. 拼入 MessagesPlaceholder 并调用</text>
</g>
<g class="message" data-from="Model" data-to="RWMH" data-label="3. 返回新 AIMessage 回答" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="803.194" y1="272.45" x2="286.276" y2="272.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="544.735" y="262.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">3. 返回新 AIMessage 回答</text>
</g>
<g class="message" data-from="RWMH" data-to="Storage" data-label="4. 将本轮问答写回存储" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="286.276" y1="312.45" x2="585.49" y2="312.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="435.88300000000004" y="302.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">4. 将本轮问答写回存储</text>
</g>
<g class="message" data-from="RWMH" data-to="User" data-label="吐出回答内容" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="286.276" y1="352.45" x2="70" y2="352.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="178.138" y="342.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">吐出回答内容</text>
</g>
<g class="actor" data-id="User" data-label="用户" data-type="actor">
  <g transform="translate(52,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="70" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">用户</text>
</g>
<g class="actor" data-id="RWMH" data-label="RunnableWithMessageHistory
(调度层)" data-type="participant">
  <rect x="150" y="30" width="272.552" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="286.276" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)"><tspan x="286.276" dy="-3.9000000000000012">RunnableWithMessageHistory</tspan><tspan x="286.276" dy="16.900000000000002">(调度层)</tspan></text>
</g>
<g class="actor" data-id="Storage" data-label="ChatMessageHistory
(内存 / Redis)" data-type="participant">
  <rect x="462.552" y="30" width="245.87599999999995" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="585.49" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)"><tspan x="585.49" dy="-3.9000000000000012">ChatMessageHistory</tspan><tspan x="585.49" dy="16.900000000000002">(内存 / Redis)</tspan></text>
</g>
<g class="actor" data-id="Model" data-label="大模型 LLM" data-type="participant">
  <rect x="748.428" y="30" width="109.532" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="803.194" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">大模型 LLM</text>
</g>
</svg>
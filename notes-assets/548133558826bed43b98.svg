  </g>
  <text x="111.729" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">用户 / 业务审核员</text>
</g>
<g class="actor" data-id="Graph" data-label="LangGraph 引擎" data-type="participant">
  <rect x="366.59649999999993" y="30" width="133.985" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="433.58899999999994" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">LangGraph 引擎</text>

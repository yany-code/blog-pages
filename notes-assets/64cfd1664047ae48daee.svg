<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918.94 133.8" width="918.94" height="133.8" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="S1" data-to="S2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="151.60399999999998,66.9 199.60399999999998,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S2" data-to="S3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="324.546,66.9 372.546,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S3" data-to="S4" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="497.488,66.9 545.488,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S4" data-to="S5" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="692.6600000000001,66.9 740.6600000000001,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="S1" data-label="1. 定义 State
(建黑板)" data-shape="rectangle">
  <rect x="40" y="40" width="111.604" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="95.80199999999999" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="95.80199999999999" dy="-3.9000000000000012">1. 定义 State</tspan><tspan x="95.80199999999999" dy="16.900000000000002">(建黑板)</tspan></text>
</g>
<g class="node" data-id="S2" data-label="2. 编写 Nodes
(写干活函数)" data-shape="rectangle">
  <rect x="199.60399999999998" y="40" width="124.942" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="262.075" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="262.075" dy="-3.9000000000000012">2. 编写 Nodes</tspan><tspan x="262.075" dy="16.900000000000002">(写干活函数)</tspan></text>
</g>
<g class="node" data-id="S3" data-label="3. 连接 Edges
(画路线图)" data-shape="rectangle">
  <rect x="372.546" y="40" width="124.942" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="435.017" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="435.017" dy="-3.9000000000000012">3. 连接 Edges</tspan><tspan x="435.017" dy="16.900000000000002">(画路线图)</tspan></text>
</g>
<g class="node" data-id="S4" data-label="4. 编译 compile()
(生成可执行App)" data-shape="rectangle">
  <rect x="545.488" y="40" width="147.172" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="619.0740000000001" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="619.0740000000001" dy="-3.9000000000000012">4. 编译 compile()</tspan><tspan x="619.0740000000001" dy="16.900000000000002">(生成可执行App)</tspan></text>
</g>
<g class="node" data-id="S5" data-label="5. 执行 invoke()
(输入初始状态)" data-shape="rectangle">
  <rect x="740.6600000000001" y="40" width="138.28" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="809.8000000000001" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="809.8000000000001" dy="-3.9000000000000012">5. 执行 invoke()</tspan><tspan x="809.8000000000001" dy="16.900000000000002">(输入初始状态)</tspan></text>
</g>
</svg>